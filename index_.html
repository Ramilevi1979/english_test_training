<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>משחק חזרה באנגלית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column; hub of big topic tiles, then one question at a time. Textbook-inspired sky blue + sunny yellow. */
:root{
  --bg:#eef5fc; --surface:#ffffff; --ink:#14283f; --muted:#5a6e86; --line:#d3e0ee;
  --blue:#1f6fe0; --on-blue:#ffffff; --sun:#ffc82e; --on-sun:#3a2c00;
  --good:#17895a; --good-bg:#dff5ea; --bad:#c93a50; --bad-bg:#fde6ea;
  --font-ui:'Rubik',system-ui,sans-serif; --font-en:'Fredoka','Rubik',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1a2b; --surface:#16283f; --ink:#eaf1fa; --muted:#9db2c9; --line:#2a405c;
  --blue:#5aa2ff; --on-blue:#06182f; --sun:#ffc82e; --on-sun:#3a2c00;
  --good:#4cd08f; --good-bg:#12382b; --bad:#ff7b8e; --bad-bg:#3d1a24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a2b; --surface:#16283f; --ink:#eaf1fa; --muted:#9db2c9; --line:#2a405c;
  --blue:#5aa2ff; --on-blue:#06182f; --sun:#ffc82e; --on-sun:#3a2c00;
  --good:#4cd08f; --good-bg:#12382b; --bad:#ff7b8e; --bad-bg:#3d1a24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.5;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:760px;margin:0 auto}
h1{font-size:1.9rem;line-height:1.15;margin:0 0 4px;text-wrap:balance}
h2{font-size:1.3rem;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--font-en);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;min-height:132px}
.tile:hover{border-color:var(--blue)}
.tile .t{font-weight:700;font-size:1.15rem}
.tile .d{color:var(--muted);font-size:.92rem}
.tile .st{margin-top:auto;font-size:1.05rem;letter-spacing:2px}
.tile.main{background:var(--blue);border-color:var(--blue);color:var(--on-blue);grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:space-between}
.tile.main .d{color:inherit;opacity:.9}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.link{background:none;border:0;color:var(--blue);font-weight:500;padding:6px 0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.cnt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.instr{margin:0;font-weight:500;color:var(--muted)}
.prompt{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:110px;text-align:center}
.big{font-family:var(--font-en);font-weight:600;font-size:7rem;line-height:1}
.word{font-family:var(--font-en);font-weight:600;font-size:3rem;direction:ltr}
.heb{font-size:2.4rem;font-weight:700}
.emo{font-size:5rem;line-height:1}
.sent{font-family:var(--font-en);font-weight:600;font-size:1.9rem;direction:ltr;unicode-bidi:isolate;display:inline-block}
.word{unicode-bidi:isolate}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{background:var(--sun);color:var(--on-sun);border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.pill.alt{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:14px;min-height:92px;padding:10px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:500}
.opt.en{font-size:1.9rem}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .3s}
.opt:disabled{cursor:default}
.opt .lt{font-family:var(--font-en);font-weight:600;font-size:3.6rem;line-height:1}
.opt.tick,.opt.cross{font-size:2.8rem}
.fb{min-height:1.6em;font-weight:700;text-align:center}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.next{align-self:center;background:var(--blue);color:var(--on-blue);border:0;border-radius:12px;padding:12px 28px;font-weight:700;font-size:1.1rem}
.scene{display:flex;align-items:center;justify-content:center;gap:8px;min-height:72px}
.ico{display:inline-flex;width:62px}
.ico.big2{width:92px} .ico.small2{width:34px}
.ico svg{width:100%;height:auto;display:block}
.opt .scene{min-height:0}
.sw{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);display:inline-block}
.blank{display:inline-block;min-width:3.2ch;border-bottom:4px solid var(--blue);margin:0 6px}
.res{text-align:center;gap:10px}
.res .stars{font-size:3.4rem;letter-spacing:6px}
.res .score{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.res .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vcard{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.vcard:hover{border-color:var(--blue)}
.vcard .e{font-size:2.4rem;line-height:1.1}
.vcard .w{font-family:var(--font-en);font-weight:600;font-size:1.5rem}
.vcard .h{color:var(--muted);font-size:.95rem}
.group{margin:22px 0 10px;font-weight:700;color:var(--muted)}
.cv{width:100%;max-width:520px;aspect-ratio:1.2;background:var(--bg);border:2px solid var(--line);border-radius:14px;touch-action:none;align-self:center;display:block}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.letters button{font-family:var(--font-en);font-weight:600;font-size:1.6rem;min-width:52px;height:52px;background:var(--bg);border:2px solid var(--line);border-radius:12px}
.letters button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.big{font-size:5.5rem}.word{font-size:2.4rem}.tile.main{flex-direction:column;align-items:flex-start;gap:6px}}
</style>

<body><div id="app" dir="rtl" lang="he"></div>

<script>
/* ---------- helpers ---------- */
const app=document.getElementById('app');
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n=1)=>shuffle(a).slice(0,n);
const one=a=>a[rnd(a.length)];
const store={get(){try{return JSON.parse(localStorage.getItem('eng-best')||'{}')}catch(e){return{}}},
  set(id,s){try{const b=store.get();b[id]=Math.max(b[id]||0,s);localStorage.setItem('eng-best',JSON.stringify(b))}catch(e){}}};

/* ---------- speech ---------- */
let voice=null;
function loadVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function speak(t,rate=.7){if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;speechSynthesis.speak(u)}catch(e){}}
/* "Letter A" avoids the voice reading a lone A as the article; then an example word */
const LWORD={a:'apple',b:'banana',d:'dad',g:'girl',n:'nine'};
const letterSay=l=>`Letter ${l.toUpperCase()}. ... ${LWORD[l]}. ... Letter ${l.toUpperCase()}.`;

/* ---------- pictures ---------- */
const COL={green:'#2f9e5a',black:'#2b2f38',orange:'#f08a24',blue:'#2a74d6',yellow:'#f6c928',red:'#d9413a',white:'#ffffff',gray:'#8a929c'};
const SHADE='rgba(0,0,0,.22)',LIGHT='rgba(255,255,255,.55)';
const OBJ={
 book:c=>`<svg viewBox="0 0 100 100"><rect x="20" y="10" width="60" height="80" rx="4" fill="${c}"/><rect x="20" y="10" width="12" height="80" rx="4" fill="${SHADE}"/><rect x="38" y="24" width="30" height="7" rx="3" fill="${LIGHT}"/></svg>`,
 bag:c=>`<svg viewBox="0 0 100 100"><path d="M36 22c0-12 28-12 28 0" fill="none" stroke="${c}" stroke-width="6"/><rect x="18" y="20" width="64" height="72" rx="20" fill="${c}"/><rect x="30" y="56" width="40" height="26" rx="8" fill="${SHADE}"/><rect x="38" y="64" width="24" height="5" rx="2" fill="${LIGHT}"/></svg>`,
 box:c=>`<svg viewBox="0 0 100 100"><polygon points="12,34 40,16 90,16 62,34" fill="${LIGHT}" stroke="${c}" stroke-width="3"/><rect x="12" y="34" width="50" height="52" fill="${c}"/><polygon points="62,34 90,16 90,68 62,86" fill="${SHADE}"/></svg>`,
 banana:c=>`<svg viewBox="0 0 100 100"><path d="M24 22C26 70 62 90 90 56C66 72 46 58 42 18Z" fill="${c}" stroke="${SHADE}" stroke-width="3" stroke-linejoin="round"/><rect x="26" y="12" width="14" height="10" rx="3" fill="#5b4a2a"/></svg>`
};
const ico=(o,c,sz='')=>`<span class="ico ${sz}">${OBJ[o](COL[c])}</span>`;
const scene=items=>`<span class="scene">${items.map(i=>i.startsWith?i:ico(...i)).join('')}</span>`;
const sw=c=>`<span class="sw" style="background:${COL[c]}"></span>`;

/* ---------- vocabulary ---------- */
const EM={boy:['👦','ילד'],girl:['👧','ילדה'],mom:['👩‍🍼','אמא'],dog:['🐶','כלב'],cat:['🐱','חתול'],apple:['🍎','תפוח'],man:['👨','גבר'],woman:['👩','אישה'],
 baby:['👶','תינוק'],book:['📖','ספר'],box:['📦','קופסה'],notebook:['📓','מחברת'],nose:['👃','אף'],mouth:['👄','פה'],computer:['💻','מחשב'],
 sister:['👧','אחות'],brother:['👦','אח'],dad:['👨','אבא'],desk:['<svg viewBox="0 0 100 100" style="width:1em;height:1em;display:inline-block;vertical-align:middle"><rect x="6" y="26" width="88" height="10" rx="3" fill="#b9824a"/><rect x="12" y="36" width="8" height="54" fill="#8a5a2b"/><rect x="80" y="36" width="8" height="54" fill="#8a5a2b"/><rect x="54" y="36" width="26" height="40" fill="#a06a35"/><rect x="58" y="42" width="18" height="12" rx="2" fill="#d9a96b"/><rect x="58" y="58" width="18" height="12" rx="2" fill="#d9a96b"/></svg>','שולחן כתיבה'],duck:['🦆','ברווז'],grandma:['👵','סבתא'],grandpa:['👴','סבא'],
 gift:['🎁','מתנה'],door:['🚪','דלת'],house:['🏠','בית'],banana:['🍌','בננה'],bag:['🎒','תיק']};
const NUMS=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const COLORS=['black','white','red','blue','green','yellow','orange','gray'];
const HE_COLOR={black:'שחור',white:'לבן',red:'אדום',blue:'כחול',green:'ירוק',yellow:'צהוב',orange:'כתום',gray:'אפור'};
const CORE=[['Dad','אבא'],['bad','רע'],['look','תסתכל'],['and','וְ'],['banana','בננה'],['Ann','אן (שם של ילדה)'],['bag','תיק'],['I am','אני']];
const EXTRA=[['mom','אמא'],['dog','כלב'],['cat','חתול'],['book','ספר'],['box','קופסה'],['big','גדול'],['small','קטן'],['sad','עצוב'],['girl','ילדה'],['boy','ילד'],['apple','תפוח'],['house','בית'],['door','דלת'],['desk','שולחן כתיבה'],['duck','ברווז'],['sister','אחות'],['brother','אח'],['nose','אף'],['mouth','פה'],['gift','מתנה'],['help','עזרה'],['man','גבר'],['woman','אישה']];
const ALLW=CORE.concat(EXTRA);
const art=w=>/^[aeiou]/i.test(w)?'an':'a';

function mk(correct,wrongs,fmt=x=>x,cls=''){return shuffle([{h:fmt(correct),ok:true,cls},...wrongs.map(w=>({h:fmt(w),ok:false,cls}))])}
const lt=x=>`<span class="lt">${x}</span>`;

/* ---------- question generators ---------- */
const LET=['a','b','d','g','n'];
const LOWC={a:['o','e','u'],b:['d','p','h'],d:['b','q','a'],g:['q','y','p'],n:['m','h','u']};
const UPC={A:['H','R','V'],B:['D','P','R'],D:['B','O','P'],G:['C','Q','S'],N:['M','H','W']};
const LNAME={a:'ay',b:'bee',d:'dee',g:'gee',n:'en'};

const G={
 upToLow(){const l=one(LET),U=l.toUpperCase();return{key:'ul'+l,instr:'איזו אות קטנה מתאימה לאות הגדולה?',prompt:`<span class="big">${U}</span>`,opts:mk(l,pick(LOWC[l],2),lt,'en')}},
 lowToUp(){const l=one(LET),U=l.toUpperCase();return{key:'lu'+l,instr:'איזו אות גדולה מתאימה לאות הקטנה?',prompt:`<span class="big">${l}</span>`,opts:mk(U,pick(UPC[U],2),lt,'en')}},
 hearLetter(){const l=one(LET);return{key:'hl'+l,instr:'הקשיבו לאות ובחרו אותה.',say:letterSay(l),rate:.6,prompt:'<span class="emo">🔊</span>',opts:mk(l,pick(LOWC[l],2),lt,'en')}},
 enHe(){const [e,h]=one(Math.random()<.75?CORE:ALLW);const wr=pick(ALLW.filter(x=>x[1]!==h&&x[0]!==e).map(x=>x[1]),2);
  return{key:'eh'+e,instr:'מה פירוש המילה בעברית?',say:e,prompt:`<span class="word">${e}</span>`,opts:mk(h,wr)}},
 heEn(){const [e,h]=one(Math.random()<.75?CORE:ALLW);const wr=pick(ALLW.filter(x=>x[0]!==e&&x[1]!==h).map(x=>x[0]),2);
  return{key:'he'+e,instr:'איך אומרים את זה באנגלית?',prompt:`<span class="heb">${h}</span>`,opts:mk(e,wr,x=>x,'en')}},
 circle(){const os=pick(['book','bag','box'],2),cs=pick(['green','black','orange','blue','yellow','red'],2);
  const [o1,o2]=os,[c1,c2]=cs;const base=[[o1,c1],[o2,c2]];
  const w1=[[o1,one(Object.keys(COL).filter(c=>!['white','gray',c1,c2].includes(c)))],[o2,c2]];
  const w2=[[o1,c1],[one(['book','bag','box'].filter(o=>o!==o1&&o!==o2)),c2]];
  const w3=[[o1,c2],[o2,c1]];
  const text=`A ${c1} ${o1} and a ${c2} ${o2}.`;
  return{key:'ci'+text,instr:'האזינו והקיפו את התמונה הנכונה.',say:text,text,prompt:'<span class="emo">🎧</span>',opts:mk(scene(base),[scene(w1),scene(w2),scene(w3)].slice(0,2+rnd(2)))}},
 tick(){const k=Object.keys(EM).filter(x=>!['sister','brother','dad','mom'].includes(x));const [a,b]=pick(k,2);const truth=Math.random()<.5;const said=truth?a:b;
  return{key:'ti'+a+truth,instr:'האזינו וסמנו ✓ (נכון) או ✗ (לא נכון).',say:`${art(said)} ${said}.`,text:`${art(said)} ${said}.`,prompt:`<span class="emo">${EM[a][0]}</span>`,
   opts:[{h:'✓',ok:truth,cls:'tick'},{h:'✗',ok:!truth,cls:'cross'}],two:true}},
 hearNum(){const n=rnd(13);const wr=pick([...Array(13).keys()].filter(x=>x!==n),2);return{key:'nu'+n,instr:'הקשיבו ובחרו את המספר.',say:`${NUMS[n]}. ... ${NUMS[n]}.`,rate:.55,text:NUMS[n],prompt:'<span class="emo">🔊</span>',opts:mk(n,wr,x=>`<span class="lt">${x}</span>`,'en')}},
 hearColor(){const c=one(COLORS);return{key:'co'+c,instr:'הקשיבו ובחרו את הצבע.',say:`${c}. ... ${c}.`,rate:.55,text:c,prompt:'<span class="emo">🔊</span>',opts:mk(c,pick(COLORS.filter(x=>x!==c),2),sw)}},
 first(){const items=[['boy','b'],['dog','d'],['girl','g'],['nine','n'],['apple','a'],['book','b'],['baby','b'],['door','d'],['gift','g'],['house','h'],['banana','b'],['duck','d'],['desk','d'],['bag','b'],['notebook','n'],['nose','n'],['grandma','g'],['grandpa','g'],['dad','d']];
  const [w,l]=one(items);const vis=w==='nine'?'<span class="big" style="color:var(--blue)">9</span>':`<span class="emo">${EM[w][0]}</span>`;
  let pool=['b','d','g','n','a','h'].filter(x=>x!==l);let wr=pick(pool,2);if((l==='b'||l==='d')&&!wr.includes(l==='b'?'d':'b'))wr[0]=l==='b'?'d':'b';
  return{key:'fi'+w,instr:'באיזו אות מתחילה המילה? אפשר להקשיב לה.',say:w,text:w,prompt:vis,opts:mk(l,wr,lt,'en')}},
 readObj(){const o=one(['bag','book','box','banana']);const cols=o==='banana'?['yellow','green']:['green','black','orange','blue','yellow','red'];const c=one(cols);
  const c2=one(cols.filter(x=>x!==c));const o2=one(['bag','book','box'].filter(x=>x!==o));const c3=o2==='banana'?'yellow':c;
  const colored=Math.random()<.6;
  if(!colored)return{key:'ro'+o,instr:'קראו את המשפט ובחרו את התמונה.',prompt:`<span class="sent">Look! ${art(o)} ${o}.</span>`,opts:mk(scene([[o,one(['green','red','blue','orange'])]]),[scene([[o2,one(['green','red','blue'])]]),scene([[one(['bag','book','box'].filter(x=>x!==o&&x!==o2)),'orange']])])};
  return{key:'rc'+o+c,instr:'קראו את המשפט ובחרו את התמונה.',prompt:`<span class="sent">Look! A ${c} ${o}.</span>`,opts:mk(scene([[o,c]]),[scene([[o,c2]]),scene([[o2,c3]])])}},
 readTwo(){const c=one(['green','blue','red','yellow','orange']);const c2=one(['green','blue','red','yellow','orange'].filter(x=>x!==c));
  return{key:'rt'+c,instr:'קראו את המשפט ובחרו את התמונה.',prompt:`<span class="sent">A ${c} bag and a banana.</span>`,
   opts:mk(scene([['bag',c],['banana','yellow']]),[scene([['bag',c2],['banana','yellow']]),scene([['bag',c],['book','yellow']])])}},
 readSize(){const o=one(['bag','book','box']),big=Math.random()<.5,o2=one(['bag','book','box'].filter(x=>x!==o));const c=one(['green','blue','red','orange']);
  return{key:'rs'+o+big,instr:'קראו את המשפט ובחרו את התמונה.',prompt:`<span class="sent">A ${big?'big':'small'} ${o}.</span>`,
   opts:mk(scene([[o,c,big?'big2':'small2']]),[scene([[o,c,big?'small2':'big2']]),scene([[o2,c,big?'big2':'small2']])])}},
 readPeople(){const L=[['Dad and Ann.','👨👧',['👩👧','👨👦']],['Dad and Mom.','👨👩',['👨👧','👩👧']],['I am bad.','😈',['😢','😊']],['I am sad.','😢',['😈','😊']],['Look! A dog.','🐶',['🐱','🦆']],['Look! A cat.','🐱',['🐶','🦆']]];
  const [s,a,w]=one(L);return{key:'rp'+s,instr:'קראו את המשפט ובחרו את התמונה.',prompt:`<span class="sent">${s}</span>`,opts:mk(a,w,x=>`<span class="emo" style="font-size:3rem">${x}</span>`)}},
 fill(){const L=[['Dad ___ Ann.','and',['look','am','bad'],'אבא ... אן'],['___! A bag.','Look',['and','am','Ann'],'... תיק!'],['I ___ bad.','am',['and','look','Dad'],'אני ... רע'],['A banana ___ a bag.','and',['look','am','bad'],'בננה ... תיק'],['I ___ Ann.','am',['and','look','bad'],'אני ... אן']];
  const [s,a,w,he]=one(L);return{key:'fl'+s,instr:`השלימו את המשפט. (${he})`,prompt:`<span class="sent">${s.replace('___','<span class="blank"></span>')}</span>`,opts:mk(a,w,x=>x,'en')}}
};

/* ---------- topics ---------- */
const TOPICS={
 letters:{t:'האותיות',d:'Aa Bb Dd Gg Nn – גדולות וקטנות',gens:[G.upToLow,G.lowToUp,G.hearLetter],n:10},
 words:{t:'מילים ותרגום',d:'Dad, bad, look, and, banana, Ann, bag, I am',gens:[G.enHe,G.heEn],n:10},
 listen:{t:'הבנת הנשמע',d:'משימות 1–4: מקשיבים ובוחרים',gens:[G.circle,G.tick,G.hearNum,G.hearColor],n:8},
 first:{t:'האות הראשונה',d:'משימות 5 ו-7: מתאימים אות לתמונה',gens:[G.first],n:10},
 read:{t:'הבנת הנקרא',d:'משימה 9: קוראים ובוחרים תמונה',gens:[G.readObj,G.readTwo,G.readSize,G.readPeople,G.fill],n:8}
};
TOPICS.all={t:'אתגר מלא',d:'כל הנושאים יחד, 12 שאלות',gens:[].concat(TOPICS.letters.gens,TOPICS.words.gens,TOPICS.listen.gens,TOPICS.first.gens,TOPICS.read.gens),n:12};

/* ---------- screens ---------- */
function stars(n){return n?'⭐'.repeat(n)+'☆'.repeat(3-n):'☆☆☆'}
function hub(){
  const b=store.get();
  const tile=(id,cls='')=>`<button class="tile ${cls}" data-go="${id}"><span class="t">${TOPICS[id].t}</span><span class="d">${TOPICS[id].d}</span><span class="st" aria-label="דירוג">${stars(b[id]||0)}</span></button>`;
  app.innerHTML=`<h1>חוזרים למבחן באנגלית</h1>
  <p class="sub">בוחרים נושא, עונים על השאלות ומרוויחים כוכבים. לוחצים על 🔊 כדי לשמוע שוב.</p>
  <div class="hub">
   <button class="tile main" data-go="learn"><span><span class="t">קודם כול: לומדים את המילים</span><br><span class="d">לוחצים על כרטיס ושומעים איך אומרים</span></span><span class="emo" style="font-size:2.4rem">📚</span></button>
   ${tile('letters')}<button class="tile" data-go="write"><span class="t">כתיבת אותיות</span><span class="d">מתרגלים כתיבה עם האצבע</span><span class="st">✍️</span></button>
   ${tile('words')}${tile('listen')}${tile('first')}${tile('read')}${tile('all')}
  </div>`;
  app.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{const g=el.dataset.go;g==='learn'?learn():g==='write'?write():start(g)});
}
function backBar(title){return `<div class="top"><button class="link" id="back">→ חזרה לתפריט</button><strong>${title}</strong></div>`}
function bindBack(){document.getElementById('back').onclick=hub}

function learn(){
  const item=(w,h,e='')=>`<button class="vcard" data-s="${w}">${e?`<span class="e">${e}</span>`:''}<span class="w">${w}</span><span class="h">${h}</span></button>`;
  const key=CORE.map(([w,h])=>item(w,h)).join('');
  const people=['boy','girl','mom','dad','man','woman','baby','sister','brother','grandma','grandpa'].map(k=>item(k,EM[k][1],EM[k][0])).join('');
  const things=['dog','cat','apple','banana','book','notebook','bag','box','computer','desk','duck','gift','door','house','nose','mouth'].map(k=>item(k,EM[k][1],EM[k][0])).join('');
  const colors=COLORS.map(c=>item(c,HE_COLOR[c],sw(c))).join('');
  const nums=NUMS.map((n,i)=>item(n,String(i))).join('');
  app.innerHTML=backBar('לומדים את המילים')+`<p class="sub">לוחצים על כרטיס כדי לשמוע את המילה.</p>
   <div class="group">המילים החשובות למבחן</div><div class="vgrid">${key}</div>
   <div class="group">אנשים</div><div class="vgrid">${people}</div>
   <div class="group">חפצים, חיות ובית</div><div class="vgrid">${things}</div>
   <div class="group">צבעים</div><div class="vgrid">${colors}</div>
   <div class="group">מספרים</div><div class="vgrid">${nums}</div>`;
  bindBack();app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s,.55));
}

/* writing practice */
function write(){
  const L=['A','a','B','b','D','d','G','g','N','n'];let cur='A';
  app.innerHTML=backBar('כתיבת אותיות')+`<div class="card">
    <p class="instr">בוחרים אות וכותבים עליה עם האצבע. אפשר לנקות ולנסות שוב.</p>
    <div class="letters" id="lets">${L.map(x=>`<button aria-pressed="${x===cur}" data-l="${x}">${x}</button>`).join('')}</div>
    <canvas class="cv" id="cv" width="780" height="650" aria-label="לוח כתיבה" tabindex="0"></canvas>
    <div class="tools"><button class="pill alt" id="clr">ניקוי</button><button class="pill" id="say">🔊 שמעו את האות</button></div></div>`;
  bindBack();
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');
  const ink=()=>getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#14283f';
  const line=()=>getComputedStyle(document.documentElement).getPropertyValue('--line').trim()||'#d3e0ee';
  function guide(){cx.clearRect(0,0,cv.width,cv.height);
    cx.strokeStyle=line();cx.lineWidth=2;cx.setLineDash([8,8]);
    [[246],[380],[520]].forEach(([y])=>{cx.beginPath();cx.moveTo(20,y);cx.lineTo(cv.width-20,y);cx.stroke()});cx.setLineDash([]);
    cx.fillStyle=line();cx.font='600 380px Fredoka, Rubik, sans-serif';cx.textAlign='center';cx.textBaseline='alphabetic';
    cx.fillText(cur,cv.width/2,520);}
  guide();
  let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.onpointerdown=e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);cx.fillStyle=ink();cx.beginPath();cx.arc(last.x,last.y,6,0,7);cx.fill()};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);cx.strokeStyle=ink();cx.lineWidth=12;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
  document.getElementById('clr').onclick=guide;
  document.getElementById('say').onclick=()=>speak(letterSay(cur.toLowerCase()),.6);
  document.querySelectorAll('#lets button').forEach(b=>b.onclick=()=>{cur=b.dataset.l;document.querySelectorAll('#lets button').forEach(x=>x.setAttribute('aria-pressed',x===b));guide();speak(letterSay(cur.toLowerCase()),.6)});
  try{document.fonts.load('600 40px Fredoka').then(guide)}catch(e){}
}

/* quiz engine */
let R=null;
function build(id){const T=TOPICS[id],qs=[],seen=new Set();let g=0;
  while(qs.length<T.n&&g++<300){const q=one(T.gens)();if(seen.has(q.key))continue;seen.add(q.key);
    if(!q.opts||q.opts.filter(o=>o.ok).length!==1)continue;qs.push(q)}
  return qs}
function start(id){R={id,qs:build(id),i:0,score:0,tried:false};q()}
function q(){
  const Q=R.qs[R.i];R.tried=false;
  const speakBtn=Q.say?`<button class="pill" id="sp">🔊 שמעו${Q.say&&Q.prompt.includes('🔊')?'':' שוב'}</button>`:'';
  const textBtn=Q.text&&Q.say?`<button class="pill alt" id="tx">הצגת הטקסט</button>`:'';
  app.innerHTML=`<div class="top"><button class="link" id="back">→ תפריט</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${R.qs.length}" aria-valuenow="${R.i}"><i style="width:${R.i/R.qs.length*100}%"></i></div><span class="cnt" dir="ltr">${R.i+1} / ${R.qs.length}</span></div>
  <div class="card"><p class="instr">${Q.instr}</p>
   <div class="prompt">${Q.prompt}</div>
   <div class="tools">${speakBtn}${textBtn}</div><div class="en" id="txt" dir="ltr" style="text-align:center;font-size:1.5rem" hidden>${Q.text||''}</div>
   <div class="opts" style="${Q.two?'grid-template-columns:1fr 1fr':''}">${Q.opts.map((o,k)=>`<button class="opt ${o.cls||''}" data-k="${k}">${o.h}</button>`).join('')}</div>
   <div class="fb" id="fb" aria-live="polite"></div></div>`;
  document.getElementById('back').onclick=hub;
  if(Q.say){document.getElementById('sp').onclick=()=>speak(Q.say,Q.rate);setTimeout(()=>speak(Q.say,Q.rate),300)}
  const tx=document.getElementById('tx');if(tx)tx.onclick=()=>{document.getElementById('txt').hidden=false;tx.hidden=true};
  const fb=document.getElementById('fb');
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=Q.opts[b.dataset.k];
    if(o.ok){b.classList.add('good');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      if(!R.tried)R.score++;fb.className='fb good';fb.textContent=R.tried?'נכון! ממשיכות הלאה.':one(['כל הכבוד!','מצוין!','יפה מאוד!','נכון!']);
      const last=R.i+1>=R.qs.length;
      const n=document.createElement('button');n.className='next';n.textContent=last?'לתוצאות':'השאלה הבאה';n.onclick=()=>{R.i++;R.i<R.qs.length?q():result()};
      fb.after(n);try{n.focus({preventScroll:true});n.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
    }else{R.tried=true;b.classList.add('bad');b.disabled=true;fb.className='fb bad';fb.textContent='כמעט! נסי שוב.'}
  });
}
function result(){
  const p=R.score/R.qs.length,s=p>=.9?3:p>=.6?2:1;store.set(R.id,s);
  const msg=s===3?'מדהים! את מוכנה למבחן.':s===2?'יפה מאוד! עוד סיבוב אחד ותהיי מושלמת.':'התחלה טובה! כל סיבוב עוזר, ננסה שוב.';
  app.innerHTML=`<div class="card res"><h2>${TOPICS[R.id].t}</h2><div class="stars" aria-label="${s} כוכבים">${'⭐'.repeat(s)}</div>
   <div class="score">${R.score} מתוך ${R.qs.length}</div><p>${msg}</p>
   <div class="row"><button class="next" id="again">עוד סיבוב</button><button class="pill alt" id="menu">לתפריט</button></div></div>`;
  document.getElementById('again').onclick=()=>start(R.id);document.getElementById('menu').onclick=hub;
}
hub();
</script>
